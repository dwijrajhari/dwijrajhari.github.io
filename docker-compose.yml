# Volume mount overwrites the image; run `bundle install` on start so gems match
# Gemfile.lock for Linux (avoids macOS lockfile vs aarch64-linux gem mismatch).
services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      BUNDLE_FORCE_RUBY_PLATFORM: "1"
    command: >
      sh -c "bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload"
